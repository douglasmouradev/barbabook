name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: barbabook
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql

      - name: Import schema
        run: mysql -h 127.0.0.1 -uroot -proot barbabook < database/schema.sql

      - name: PHP syntax check
        run: find app admin barbeiro nails config includes . -maxdepth 3 -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Smoke test (home)
        run: |
          php -S 127.0.0.1:8000 &
          sleep 2
          curl -sf -o /dev/null http://127.0.0.1:8000/index.php
